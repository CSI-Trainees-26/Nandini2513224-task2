<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitCheck - Tasks</title>

    <link rel="stylesheet" href="tasks.css">
</head>

<body>
    <!-- sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-mark">💪</div>
            <h2>FitCheck</h2>
        </div>

        <nav class="side-nav">
            <a class="sidebar-link" href="index.html"><span class="icon">🏠</span> Dashboard</a>
            <a class="sidebar-link" href="tasks.html"><span class="icon">✅</span> Tasks</a>
            <a class="sidebar-link" href="habits.html"><span class="icon">📅</span> Habits</a>
            <a class="sidebar-link" href="water.html"><span class="icon">💧</span> Water</a>
            <a class="sidebar-link" href="sleep.html"><span class="icon">🌙</span> Sleep</a>
            <a class="sidebar-link" href="timer.html"><span class="icon">⏱️</span> Timer</a>
            <a class="sidebar-link" href="quotes.html"><span class="icon">💬</span> Saved Quotes</a>
            <a class="sidebar-link" href="summary.html"><span class="icon">📊</span> Weekly Summary</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <p class="small-heading">STAY ORGANIZED</p>
            <h1>Task Manager</h1>
            <p>Add, complete and manage your daily tasks.</p>
        </header>
        <section class="add-task-card">
            <input
                type="text"
                id="taskInput"
                placeholder="Write a new task...">
            <button id="addTaskButton">
                + Add Task
            </button>
        </section>
        <section class="task-board">
            <div class="task-column">
                <div class="column-heading">
                    <h2>Pending</h2>
                    <span id="pendingCount">0</span>
                </div>
                <div id="pendingTasks" class="task-list">
                </div>
            </div>
            <div class="task-column">
                <div class="column-heading">
                    <h2>Completed</h2>
                    <span id="completedCount">0</span>
                </div>
                <div id="completedTasks" class="task-list">
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
